<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 선택</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#172333;margin:0}main{max-width:1100px;margin:auto;padding:22px}h1{font-size:2rem}button,select{font:inherit;cursor:pointer;border:2px solid #64748b;border-radius:12px;background:white;color:#172333;padding:14px}button:focus-visible,select:focus-visible{outline:4px solid #e58b00;outline-offset:3px}nav,.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button[aria-pressed=true]{border:4px solid #14623d;background:#e4f6e9}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}.item{padding:8px;font-size:1.5rem;font-weight:700}.item img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#fff;border-radius:8px}.item span{display:block;padding:10px}#result{font-size:1.3rem;min-height:2em}footer{font-size:.9rem;color:#475569}</style></head><body><main><h1>나의 선택</h1><p>그림을 보고 원하는 것을 골라 주세요.</p><nav id="nav" aria-label="조사 영역"></nav><div class="tools"><label>선택 방식 <select id="mode"><option value="multi">여러 개 선택</option><option value="single">하나 선택</option></select></label><label>한 화면에 <select id="count"><option>2</option><option selected>4</option><option>6</option></select> 개</label></div><h2 id="question"></h2><div id="grid"></div><div class="tools"><button id="prev">이전 그림</button><span id="page"></span><button id="next">다음 그림</button></div><div class="tools"><button id="none">원하는 것이 없어요</button><button id="unknown">잘 모르겠어요</button><button id="clear">다시 선택</button></div><h2>선택 결과</h2><p id="result" aria-live="polite"></p><footer>초기 시험 버전 · 결과는 현재 화면에서만 유지됩니다.</footer></main><script src="app.js"></script></body></html>
