<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>욕구조사 사정도구</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#172333;margin:0}main{max-width:1100px;margin:auto;padding:22px}h1{font-size:2rem}button,select{font:inherit;cursor:pointer;border:2px solid #64748b;border-radius:12px;background:white;color:#172333;padding:14px}button:focus-visible,select:focus-visible{outline:4px solid #e58b00;outline-offset:3px}nav,.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button[aria-pressed=true]{border:4px solid #14623d;background:#e4f6e9}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}.item{padding:8px;font-size:1.5rem;font-weight:700}.item img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#fff;border-radius:8px}.item span{display:block;padding:10px}#result{font-size:1.3rem;min-height:2em}footer{font-size:.9rem;color:#475569}[hidden]{display:none!important}#start-page{max-width:560px;margin:48px auto}#start-page h1{text-align:center;margin-bottom:40px}#start-form{background:white;border:1px solid #cbd5e1;border-radius:16px;padding:clamp(18px,5vw,36px);display:grid;gap:12px}#start-form label{font-size:1.2rem;font-weight:700}#start-form input{font:inherit;font-size:1.2rem;padding:14px;border:2px solid #64748b;border-radius:10px;min-width:0}#start-form input:focus-visible{outline:4px solid #e58b00;outline-offset:3px}#start-form button{background:#14623d;color:white;font-weight:700;font-size:1.2rem;margin-top:14px}#survey-title{text-align:center}#surveyor-info{text-align:center;color:#475569}#nav{position:sticky;top:0;background:#f5f7fa;z-index:3;padding:10px 0}#nav button{flex:1;min-width:90px}#subnav button{padding:10px}#grid{grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}.item{min-width:0}.placeholder{display:grid;place-items:center;aspect-ratio:1;background:#e7edf2;color:#475569;font-size:1rem;border-radius:8px}.item small{display:block;font-size:.8rem;font-weight:400}#progress{width:100%}#review-list{display:grid;gap:12px}#review-list img{width:100px;height:100px;object-fit:contain}#review-list article{background:white;padding:16px;border-radius:12px}#review-list .chosen{display:flex;flex-wrap:wrap;gap:12px}#review-list figure{margin:0;text-align:center}#review-list figcaption{max-width:120px}button:disabled{opacity:.5;cursor:default}@media(max-width:600px){#grid{grid-template-columns:repeat(min(var(--cols,2),2),minmax(0,1fr))}.item{font-size:1.15rem}main{padding:12px}}.resident-input{display:flex;gap:8px}.resident-input input{flex:1;width:0}#start-form .resident-input button,#start-form #resident-list button{margin:0;padding:10px;font-size:1rem}#resident-list,#resident-tabs{display:flex;gap:8px;flex-wrap:wrap}#resident-list span{display:flex;align-items:center;gap:6px;padding:6px;background:#e7edf2;border-radius:8px}#resident-tabs button{font-weight:700}#resident-status{color:#475569}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;background:white}th,td{border:1px solid #94a3b8;padding:9px;text-align:left;vertical-align:top}th{background:#e7edf2}#review-list td{white-space:pre-wrap;min-width:110px}</style></head><body><main><section id="start-page"><h1>욕구조사 사정도구</h1><form id="start-form" autocomplete="off"><label for="resident-name">입주인 이름</label><div class="resident-input"><input id="resident-name" name="resident-name" type="text" maxlength="80" placeholder="입주인 이름을 입력해 주세요"><button type="button" id="add-resident">추가</button></div><div id="resident-list" aria-live="polite"></div><label for="surveyor-name">조사자 이름</label><input id="surveyor-name" name="surveyor-name" type="text" required maxlength="80" placeholder="조사자 이름을 입력해 주세요"><button type="submit">욕구조사 시작</button></form></section><section id="survey-page" hidden><h1 id="survey-title">나의 선택</h1><p id="surveyor-info"></p><nav id="resident-tabs" aria-label="입주인 선택"></nav><p id="resident-status" aria-live="polite"></p><p>그림을 보고 원하는 것을 골라 주세요.</p><nav id="nav" aria-label="조사 영역"></nav><nav id="subnav" aria-label="세부 분류"></nav><div class="tools"><label>선택 방식 <select id="mode"><option value="multi">여러 개 선택</option><option value="single">하나 선택</option></select></label><label>한 화면에 <select id="count"><option>1</option><option>2</option><option selected>4</option><option>6</option><option>8</option><option value="all">전체 보기</option></select> 개</label></div><h2 id="question"></h2><p id="progress-label"></p><progress id="progress" max="1" value="0"></progress><p id="image-notice">실사 이미지 준비 중인 항목은 문자 카드로 표시됩니다. 이미지 기반 현장 조사에는 정식 이미지 등록 후 사용해 주세요.</p><div id="grid"></div><div class="tools"><button id="prev">이전 그림</button><span id="page"></span><button id="next">다음 그림</button></div><div class="tools"><button id="none">원하는 것이 없어요</button><button id="unknown">잘 모르겠어요</button><button id="clear">다시 선택</button></div><h2>선택 결과</h2><p id="result" aria-live="polite"></p><div class="tools"><button id="review">전체 결과 확인</button><button id="reset">현재 입주인 초기화</button><button id="reset-all">전체 조사 초기화</button></div><section id="review-panel" hidden><h2>전체 조사 결과 재확인</h2><div id="review-list"></div><button id="txt">TXT 표 저장</button><button id="report-html">표 문서 저장(HTML)</button><button id="close-review">조사 계속하기</button></section><footer>V0.4 · 다중 입주인 · 시험 버전 · 결과는 브라우저 메모리에만 유지됩니다.</footer></section></main><script src="app.js?v=multi04"></script></body></html>
